name: Supabase validation

# Validación MANUAL contra un proyecto Supabase de validación. Nunca se
# ejecuta en push ni en pull_request. Detalle, matriz de pruebas y
# configuración de secrets: docs/SUPABASE_VALIDATION.md.
#
# Proyecto de destino (F1, allow-list): confirm_project elige el proyecto y su
# GitHub Environment, EXCLUSIVAMENTE entre:
#   - roomly-validation-3  → camino de compatibilidad (R8 / Fase 4 incremental);
#   - roomly-validation-4  → proyecto aislado de instalación limpia (D2).
# Quedan rechazados los proyectos de validación anteriores (Fase 2.8 y Fase 1),
# producción y cualquier marca desconocida. Cada job usa el
# Environment `${{ inputs.confirm_project }}`: los secrets viven SOLO ahí
# (GitHub → Settings → Environments), no como secrets del repositorio.
#
# Secrets del Environment:
#   SUPABASE_VALIDATION_PROJECT_REF       ref del proyecto (no secreto, pero se usa como guarda)
#   SUPABASE_VALIDATION_URL               https://<ref>.supabase.co
#   SUPABASE_VALIDATION_ANON_KEY          clave pública (anon / publishable)
#   SUPABASE_VALIDATION_SERVICE_ROLE_KEY  PRIVILEGIADA (service_role / secret)
#   SUPABASE_VALIDATION_DB_URL            PRIVILEGIADA: cadena del Session pooler (incluye contraseña)
#   E2E_EMAIL_TEMPLATE                    dirección de prueba con {id} (solo e2e-real)
#   E2E_MAILBOX_CONFIG                    configuración del buzón de prueba, opaca (solo e2e-real)
# Variables del Environment (no secretas):
#   SUPABASE_VALIDATION_MARKER            marca de este proyecto (roomly-validation-3 o -4);
#                                         tiene que coincidir con confirm_project y con la de la BD
#   E2E_MAILBOX_ADAPTER                   módulo adaptador del buzón dentro de tests/e2e/
# Cada paso recibe solo los secrets que necesita; service_role nunca llega a
# la app ni al proceso de Playwright.
#
# Identidad (F1): antes de migrar, comprobar o crear usuarios, cada punto de
# entrada verifica EN la propia base de datos la marca
#   COMMENT ON DATABASE postgres IS '<marca>';
# donde <marca> es la del Environment (SUPABASE_VALIDATION_MARKER), que tiene
# que estar en la allow-list y coincidir con confirm_project. Si falta o no
# coincide exactamente, todo aborta. Sin fallback. Las marcas de los proyectos
# de validación anteriores (Fases 1 y 2.8) no pasan.
#
# R8 (Fase 4): phase4_upgrade aplica a roomly-validation-3 solo las tres
# migraciones de la Fase 4 sobre el esquema de la Fase 3, con
# tests/supabase/phase4-upgrade.sh (ver docs/SUPABASE_VALIDATION.md):
#   - dry_run: una transacción que termina siempre en ROLLBACK; no ejecuta
#     ninguna suite;
#   - apply: exige confirm_phase4_upgrade exacto, repite el ensayo y confirma
#     solo si el preflight vigente pasa dentro de la transacción; después
#     siguen el preflight y las suites, sin E2.
# No se combina con apply_migrations ni con run_e2e_real.

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Proyecto de validación de destino (su GitHub Environment y su marca)"
        required: true
        type: choice
        options:
          - roomly-validation-4
          - roomly-validation-3
        default: roomly-validation-4
      apply_migrations:
        description: "Aplicar migraciones + seed (solo la primera vez, sobre un proyecto vacío)"
        required: true
        type: boolean
        default: false
      run_e2e_real:
        description: "E2 real: alta por magic link con email real (requiere registro abierto y buzón configurado)"
        required: true
        type: boolean
        default: false
      phase4_upgrade:
        description: "R8: migraciones de la Fase 4 sobre el esquema de la Fase 3 (none, dry_run = ensayo con ROLLBACK, apply = aplicar)"
        required: true
        type: choice
        options:
          - none
          - dry_run
          - apply
        default: none
      confirm_phase4_upgrade:
        description: "Solo con phase4_upgrade=apply: escribe aplicar-fase4-en-roomly-validation-3"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-validation
  cancel-in-progress: false

jobs:
  guard:
    name: Guarda de destino
    runs-on: ubuntu-latest
    environment: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4
      - name: Entradas compatibles (phase4_upgrade frente a apply_migrations y run_e2e_real), sin conectar
        env:
          PHASE4_UPGRADE: ${{ inputs.phase4_upgrade }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          RUN_E2E_REAL: ${{ inputs.run_e2e_real }}
          PHASE4_UPGRADE_CONFIRM: ${{ inputs.confirm_phase4_upgrade }}
        run: bash tests/supabase/phase4-upgrade.sh --check-inputs
      - name: Confirmación del proyecto (allow-list, coincide con la marca del Environment, R8 solo en -3)
        env:
          CONFIRM: ${{ inputs.confirm_project }}
          ENV_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          PHASE4_UPGRADE: ${{ inputs.phase4_upgrade }}
        run: |
          case "$CONFIRM" in
            roomly-validation-3|roomly-validation-4) ;;
            *) echo "ERROR: confirm_project no es un proyecto de validación permitido (roomly-validation-3 / roomly-validation-4)" >&2; exit 1 ;;
          esac
          if [ -z "$ENV_MARKER" ]; then
            echo "ERROR: falta la variable SUPABASE_VALIDATION_MARKER en el Environment ${CONFIRM} (Settings → Environments → Variables)" >&2
            exit 1
          fi
          if [ "$CONFIRM" != "$ENV_MARKER" ]; then
            echo "ERROR: confirm_project no coincide con la marca declarada por el Environment" >&2
            exit 1
          fi
          # R8 (migraciones de la Fase 4 sobre la Fase 3) solo aplica a roomly-validation-3.
          if [ "$CONFIRM" != "roomly-validation-3" ] && [ "$PHASE4_UPGRADE" != "none" ]; then
            echo "ERROR: phase4_upgrade solo es válido con confirm_project=roomly-validation-3 (R8 es del camino de compatibilidad)" >&2
            exit 1
          fi
      - name: Secrets del mismo proyecto y marca de identidad del Environment (sin imprimirlos)
        env:
          SUPABASE_VALIDATION_PROJECT_REF: ${{ secrets.SUPABASE_VALIDATION_PROJECT_REF }}
          SUPABASE_VALIDATION_URL: ${{ secrets.SUPABASE_VALIDATION_URL }}
          SUPABASE_VALIDATION_ANON_KEY: ${{ secrets.SUPABASE_VALIDATION_ANON_KEY }}
          SUPABASE_VALIDATION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_VALIDATION_SERVICE_ROLE_KEY }}
          SUPABASE_VALIDATION_DB_URL: ${{ secrets.SUPABASE_VALIDATION_DB_URL }}
          SUPABASE_VALIDATION_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          ROOMLY_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          source tests/supabase/guard.sh SUPABASE_VALIDATION_URL SUPABASE_VALIDATION_ANON_KEY \
            SUPABASE_VALIDATION_SERVICE_ROLE_KEY SUPABASE_VALIDATION_DB_URL

  migrate:
    name: Aplicar migraciones + seed
    needs: guard
    if: ${{ inputs.apply_migrations && inputs.phase4_upgrade != 'dry_run' && inputs.phase4_upgrade != 'apply' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones existentes + seed (una transacción, se niega si el esquema ya existe)
        env:
          SUPABASE_VALIDATION_PROJECT_REF: ${{ secrets.SUPABASE_VALIDATION_PROJECT_REF }}
          SUPABASE_VALIDATION_DB_URL: ${{ secrets.SUPABASE_VALIDATION_DB_URL }}
          SUPABASE_VALIDATION_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          ROOMLY_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash tests/supabase/apply-migrations.sh

  phase4-upgrade:
    name: R8 — migraciones de la Fase 4 sobre la Fase 3 (dry_run o apply)
    needs: guard
    # R8 solo aplica a roomly-validation-3 (camino de compatibilidad). El paso de
    # confirmación de la guarda ya rechaza phase4_upgrade != none en otro proyecto.
    if: ${{ (inputs.phase4_upgrade == 'dry_run' || inputs.phase4_upgrade == 'apply') && inputs.confirm_project == 'roomly-validation-3' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.confirm_project }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Estado de partida, SHA-256, 3 migraciones y P0–P6 en una transacción (dry_run termina en ROLLBACK)
        env:
          PHASE4_UPGRADE: ${{ inputs.phase4_upgrade }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          RUN_E2E_REAL: ${{ inputs.run_e2e_real }}
          PHASE4_UPGRADE_CONFIRM: ${{ inputs.confirm_phase4_upgrade }}
          SUPABASE_VALIDATION_PROJECT_REF: ${{ secrets.SUPABASE_VALIDATION_PROJECT_REF }}
          SUPABASE_VALIDATION_DB_URL: ${{ secrets.SUPABASE_VALIDATION_DB_URL }}
          SUPABASE_VALIDATION_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          ROOMLY_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash tests/supabase/phase4-upgrade.sh "$PHASE4_UPGRADE"

  preflight:
    name: P0–P6 (infraestructura)
    needs: [guard, migrate, phase4-upgrade]
    # Con phase4_upgrade=dry_run no hay nada que comprobar después: el ensayo
    # ya pasó P0–P6 dentro de su transacción y la revirtió.
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (needs.phase4-upgrade.result == 'success' || needs.phase4-upgrade.result == 'skipped') && inputs.phase4_upgrade != 'dry_run' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4
      - name: P0–P6 — si falla, no se ejecuta ninguna suite
        env:
          SUPABASE_VALIDATION_PROJECT_REF: ${{ secrets.SUPABASE_VALIDATION_PROJECT_REF }}
          SUPABASE_VALIDATION_DB_URL: ${{ secrets.SUPABASE_VALIDATION_DB_URL }}
          SUPABASE_VALIDATION_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          ROOMLY_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash tests/supabase/run-preflight.sh

  sql-suite:
    name: Suite SQL tests/db, todos los archivos (roles reales, una sesión y un ROLLBACK por archivo)
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4
      - name: tests/db (todos los archivos) en Supabase real
        env:
          SUPABASE_VALIDATION_PROJECT_REF: ${{ secrets.SUPABASE_VALIDATION_PROJECT_REF }}
          SUPABASE_VALIDATION_DB_URL: ${{ secrets.SUPABASE_VALIDATION_DB_URL }}
          SUPABASE_VALIDATION_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          ROOMLY_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: bash tests/supabase/run-sql-suite.sh

  api-suite:
    name: API supabase-js (PR / CH / RO / RE / CRA / SVC / GC / AU2)
    needs: sql-suite
    if: ${{ !cancelled() && needs.sql-suite.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La suite verifica ella misma la marca de identidad del proyecto (F1)
      # con la conexión de BD antes de crear ningún usuario.
      - name: PR1–PR12, CH1–CH11, RO1–RO9, RE1–RE9, CRA1–CRA6, SVC1–SVC5, GC1–GC4, AU2 con JWT reales
        env:
          SUPABASE_VALIDATION_PROJECT_REF: ${{ secrets.SUPABASE_VALIDATION_PROJECT_REF }}
          SUPABASE_VALIDATION_DB_URL: ${{ secrets.SUPABASE_VALIDATION_DB_URL }}
          SUPABASE_VALIDATION_URL: ${{ secrets.SUPABASE_VALIDATION_URL }}
          SUPABASE_VALIDATION_ANON_KEY: ${{ secrets.SUPABASE_VALIDATION_ANON_KEY }}
          SUPABASE_VALIDATION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_VALIDATION_SERVICE_ROLE_KEY }}
          SUPABASE_VALIDATION_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          ROOMLY_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: npm run test:supabase -- --reporter=verbose

  auth-redirects:
    name: AU3 / AU5 (app local contra Supabase de validación)
    needs: sql-suite
    if: ${{ !cancelled() && needs.sql-suite.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Solo las variables públicas: esta app nunca recibe claves privilegiadas.
      - name: Build y arranque de la app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_VALIDATION_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_VALIDATION_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          npm run build
          nohup npm run start > /tmp/next.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "ERROR: la app no arrancó" >&2
          exit 1
      - name: AU3 / AU5
        run: bash tests/supabase/auth-redirects.sh

  e2e-real:
    name: E2 — alta real por magic link (Playwright, email real)
    needs: sql-suite
    if: ${{ !cancelled() && inputs.run_e2e_real && inputs.phase4_upgrade != 'dry_run' && inputs.phase4_upgrade != 'apply' && needs.sql-suite.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.confirm_project }}
    timeout-minutes: 30
    env:
      # Id único por ejecución: la dirección de prueba es E2E_EMAIL_TEMPLATE con {id}.
      E2E_RUN_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # El Chromium que corresponde a la versión instalada de @playwright/test.
      - run: npx playwright install --with-deps chromium
      - name: Enmascarar la dirección de prueba en el log
        env:
          E2E_EMAIL_TEMPLATE: ${{ secrets.E2E_EMAIL_TEMPLATE }}
        run: |
          node --input-type=module -e '
            import { testEmail } from "./tests/e2e/real/e2e-real-lib.mjs";
            console.log("::add-mask::" + testEmail(process.env.E2E_EMAIL_TEMPLATE, process.env.E2E_RUN_ID));
          '
      - name: Preparación — guarda F1, Auth listo y restos anteriores (service_role solo aquí y en la limpieza)
        env:
          SUPABASE_VALIDATION_PROJECT_REF: ${{ secrets.SUPABASE_VALIDATION_PROJECT_REF }}
          SUPABASE_VALIDATION_DB_URL: ${{ secrets.SUPABASE_VALIDATION_DB_URL }}
          SUPABASE_VALIDATION_URL: ${{ secrets.SUPABASE_VALIDATION_URL }}
          SUPABASE_VALIDATION_ANON_KEY: ${{ secrets.SUPABASE_VALIDATION_ANON_KEY }}
          SUPABASE_VALIDATION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_VALIDATION_SERVICE_ROLE_KEY }}
          E2E_EMAIL_TEMPLATE: ${{ secrets.E2E_EMAIL_TEMPLATE }}
          SUPABASE_VALIDATION_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          ROOMLY_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: node tests/e2e/real/cleanup.mjs before
      # Solo las variables públicas: la app nunca recibe claves privilegiadas.
      - name: Build y arranque de la app (URL + clave anon)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_VALIDATION_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_VALIDATION_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          npm run build
          nohup npm run start > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "ERROR: la app no arrancó" >&2
          exit 1
      # Sin service_role. Sin trace, vídeo, capturas ni report (ver
      # playwright.real.config.ts); no se sube ningún artefacto.
      - name: E2 — formulario real → email → magic link → /callback → onboarding → app
        env:
          E2E_APP_URL: http://localhost:3000
          SUPABASE_VALIDATION_URL: ${{ secrets.SUPABASE_VALIDATION_URL }}
          E2E_EMAIL_TEMPLATE: ${{ secrets.E2E_EMAIL_TEMPLATE }}
          E2E_MAILBOX_ADAPTER: ${{ vars.E2E_MAILBOX_ADAPTER }}
          E2E_MAILBOX_CONFIG: ${{ secrets.E2E_MAILBOX_CONFIG }}
        run: npx playwright test -c playwright.real.config.ts
      - name: Limpieza — usuario, datos, buzón y aviso de registro (siempre, aunque falle el E2)
        if: ${{ always() }}
        env:
          SUPABASE_VALIDATION_PROJECT_REF: ${{ secrets.SUPABASE_VALIDATION_PROJECT_REF }}
          SUPABASE_VALIDATION_DB_URL: ${{ secrets.SUPABASE_VALIDATION_DB_URL }}
          SUPABASE_VALIDATION_URL: ${{ secrets.SUPABASE_VALIDATION_URL }}
          SUPABASE_VALIDATION_ANON_KEY: ${{ secrets.SUPABASE_VALIDATION_ANON_KEY }}
          SUPABASE_VALIDATION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_VALIDATION_SERVICE_ROLE_KEY }}
          E2E_EMAIL_TEMPLATE: ${{ secrets.E2E_EMAIL_TEMPLATE }}
          E2E_MAILBOX_ADAPTER: ${{ vars.E2E_MAILBOX_ADAPTER }}
          E2E_MAILBOX_CONFIG: ${{ secrets.E2E_MAILBOX_CONFIG }}
          SUPABASE_VALIDATION_MARKER: ${{ vars.SUPABASE_VALIDATION_MARKER }}
          ROOMLY_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: node tests/e2e/real/cleanup.mjs after
      - name: Borrar salidas locales del runner
        if: ${{ always() }}
        run: rm -rf test-results-real "$RUNNER_TEMP/next.log"
