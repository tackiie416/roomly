name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # El build no necesita Supabase real todavía: ninguna página de
      # Foundation hace fetch de datos en build time (ver lib/env.ts,
      # validación perezosa). Se pasan como secrets de todos modos para
      # cuando Fase 2+ añada páginas que sí lo necesiten.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Tests de seguridad/RLS (tests/db) contra PostgreSQL real, sin Supabase:
  # aplica todas las migraciones sobre un shim mínimo de Supabase y falla si
  # vuelve cualquiera de los hallazgos corregidos (escalado a admin, fuga de
  # mensajes, recursión RLS, reactivación de habitaciones moderadas,
  # manipulación de reportes). Ver docs/TESTING.md.
  db-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/db/run.sh
      # Infraestructura de la validación remota (Fase 2.8), siempre en local:
      # guarda F1 (marca roomly-validation-2), runner SQL aislado por archivo
      # y preflight exacto con sus mutaciones; desde la Fase 3.1, también la
      # actualización incremental (datos de la Fase 2 + migraciones nuevas).
      # Ninguno toca Supabase.
      - run: bash tests/supabase/guard-selftest.sh
      - run: bash tests/supabase/sql-suite-selftest.sh
      - run: bash tests/supabase/preflight-selftest.sh
      - run: bash tests/supabase/migration-upgrade-selftest.sh

  # E1 — E2E local (Fase 2.8): la app real contra el Supabase simulado de
  # tests/e2e/support. Sin secrets ni Supabase real. El E2E real (E2) solo se
  # ejecuta desde el workflow manual supabase-validation.yml.
  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # El Chromium que corresponde a la versión instalada de @playwright/test.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Solo datos ficticios del mock: el report se puede conservar.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-e1
          path: playwright-report/
          retention-days: 7
