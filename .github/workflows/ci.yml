name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # El build no necesita Supabase real todavía: ninguna página de
      # Foundation hace fetch de datos en build time (ver lib/env.ts,
      # validación perezosa). Se pasan como secrets de todos modos para
      # cuando Fase 2+ añada páginas que sí lo necesiten.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Tests de seguridad/RLS (tests/db) contra PostgreSQL real, sin Supabase:
  # aplica todas las migraciones sobre un shim mínimo de Supabase y falla si
  # vuelve cualquiera de los hallazgos corregidos (escalado a admin, fuga de
  # mensajes, recursión RLS, reactivación de habitaciones moderadas,
  # manipulación de reportes). Ver docs/TESTING.md.
  db-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/db/run.sh

  # E2E deliberadamente NO incluido todavía: Playwright necesita un
  # proyecto Supabase de test (secrets que no existen aún) y, hasta que
  # Fase 2+ construya páginas de producto de verdad, no hay mucho que
  # probar de extremo a extremo más allá del smoke test de Foundation.
  # Se añade como job separado en cuanto haya credenciales de test —
  # ver docs/TESTING.md.
